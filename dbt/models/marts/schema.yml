version: 2

models:
  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: dim_city
    columns:
      - name: city_key
        tests: [unique, not_null]
      - name: city_name
        tests: [unique, not_null]
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: fact_orders
    description: "One row per order. is_revenue = still placed AND latest payment succeeded."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_id}
      - name: city_key
        tests:
          - not_null
          - relationships: {to: ref('dim_city'), field: city_key}
      - name: date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: order_status
        tests:
          - accepted_values: {values: ['placed', 'cancelled']}
      - name: payment_status
        tests:
          - accepted_values: {values: ['success', 'failed', 'no_payment']}

  - name: fact_order_items
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships: {to: ref('fact_orders'), field: order_id}
      - name: product_id
        tests:
          - not_null
          - relationships: {to: ref('dim_product'), field: product_id}
